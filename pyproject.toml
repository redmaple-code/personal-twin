[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-twin"
version = "0.1.0"
description = "A local-first personal record vault with AI-safe masked views and secret injection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "redmaple-code" }]
keywords = ["keepass", "kdbx", "secrets", "privacy", "ai-safety", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = [
  "pykeepass>=4.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
twin = "twin.cli:main"

[project.urls]
Homepage = "https://github.com/redmaple-code/personal-twin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
